name: droidtop release

# Builds Box64 for droidtop's Windows runtime the way GameNative builds the
# box64-<version>-bionic.tzst it ships (its release.yml, platform ANDROID,
# Release): NDK r26b, aarch64-linux-android31-clang, ANDROID + ARM_DYNAREC +
# BAD_SIGNAL. Publishes ./usr/bin/box64 as a zstd tar with its SHA-256.
on:
  push:
    tags: ['droidtop-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q git cmake make python3 zstd
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -qq android-ndk-r26b-linux.zip
      - name: Build
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_C_COMPILER="$GITHUB_WORKSPACE/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang" \
            -DANDROID=1 -DARM_DYNAREC=1 -DBAD_SIGNAL=1 -DCMAKE_BUILD_TYPE=Release -DCI=false
          make -j"$(nproc)"
      - name: Package
        run: |
          mkdir -p stage/usr/bin
          cp build/box64 stage/usr/bin/box64
          chmod 755 stage/usr/bin/box64
          version=$(sed -n 's/^#define BOX64_\(MAJOR\|MINOR\|REVISION\) \([0-9]*\).*/\2/p' src/box64version.h | paste -sd.)
          name="box64-$version-bionic.tzst"
          tar -C stage --owner=0 --group=0 -cf - ./usr/bin/box64 | zstd -19 -q -o "$name"
          sha256sum "$name" > "$name.sha256"
          echo "ASSET=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: box64-bionic
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "GameNative's Box64 v0.4.2 for droidtop, with guest mappings of files on noexec mounts allowed."
          gh release upload "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" --clobber
